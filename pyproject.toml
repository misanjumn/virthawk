[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virthawk"
version = "0.1.0"
description = "🦅 A CLI for libvirt guest diagnostics — inspect all running VMs, vCPUs, memory, disks, networks and snapshots in one command."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Misbah Anjum N", email = "misbah.hana@gmail.com" }]
keywords = ["libvirt", "kvm", "qemu", "virtualization", "vm", "diagnostics", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = [
    "libvirt-python>=10.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
virthawk = "virthawk.cli:main"

[project.urls]
Homepage = "https://github.com/misanjumn/virthawk"
Repository = "https://github.com/misanjumn/virthawk"
Issues = "https://github.com/misanjumn/virthawk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["virthawk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
